apiVersion: batch/v1
kind: Job
metadata:
  name: ticketflow-api-migration
  namespace: ticketflow
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticketflow-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ticketflow-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ticketflow-api-placeholder
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ticket_api.migrate"]
          envFrom:
            - configMapRef:
                name: ticketflow-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]